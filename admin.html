<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Пользователи — Лента независимых СМИ</title>
  <link rel="stylesheet" href="styles.css?v=20260823-4" />
  <style>
    .admin-shell { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 56px; }

    .admin-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .admin-head h1 { margin-bottom: 8px; font-size: clamp(28px, 4vw, 40px); line-height: 1; letter-spacing: -0.04em; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      overflow: hidden;
    }

    .panel-head {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      font-weight: 800;
    }

    .panel-body { padding: 22px; }

    .form-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
    .form-row label { flex: 1 1 190px; margin: 0; }
    .form-row label > span {
      display: block; margin-bottom: 6px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted);
    }
    .form-row input[type="text"], .form-row input[type="password"] {
      width: 100%; height: 42px; padding: 0 12px; font: inherit; font-size: 14px;
      color: var(--text); background: #fff;
      border: 1px solid var(--border); border-radius: 9px;
    }
    .form-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

    .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 13px; color: var(--muted); }
    .checkbox-row input { width: 16px; height: 16px; accent-color: var(--accent); }

    .btn {
      height: 42px; padding: 0 20px; border: 0; border-radius: 9px;
      background: var(--accent); color: #fff; font: inherit; font-size: 14px;
      font-weight: 800; cursor: pointer; transition: background 0.15s; white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: var(--accent-dark); }
    .btn:disabled { opacity: 0.55; cursor: default; }

    .btn-ghost {
      height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px;
      background: #fff; color: var(--accent); font: inherit; font-size: 12px;
      font-weight: 700; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .btn-ghost:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-ghost:disabled { opacity: 0.4; cursor: default; }
    .btn-ghost.danger { color: var(--danger); }
    .btn-ghost.danger:hover:not(:disabled) { background: var(--danger); border-color: var(--danger); color: #fff; }

    .user-row {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 14px 22px; border-bottom: 1px solid var(--border);
    }
    .user-row:last-child { border-bottom: 0; }
    .user-row.is-disabled { background: #fbf7f8; }
    .user-row.is-disabled .user-name { text-decoration: line-through; color: var(--muted); }

    .user-name { font-weight: 800; font-size: 15px; }
    .user-meta { font-size: 12px; color: var(--muted); }
    .user-actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

    .tag {
      display: inline-block; padding: 1px 8px; border-radius: 9px;
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .tag-admin { background: var(--accent); color: #fff; }
    .tag-you { background: var(--accent-soft); color: var(--accent); }
    .tag-off { background: #fdeceb; color: var(--danger); }

    .msg { margin: 0 0 18px; padding: 11px 14px; border-radius: 9px; font-size: 13px; line-height: 1.5; }
    .msg-error { background: #fdeceb; color: var(--danger); }
    .msg-ok { background: #e8f5ed; color: #0e7a3d; }
    .msg[hidden] { display: none; }

    .hint { margin: 14px 0 0; font-size: 12px; line-height: 1.6; color: var(--muted); }
    .generated { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  </style>
</head>
<body>
  <main class="admin-shell">
    <header class="admin-head">
      <div>
        <p class="eyebrow">Администрирование</p>
        <h1>Пользователи</h1>
      </div>
      <a class="btn-ghost" href="/">← К ленте</a>
    </header>

    <p id="message" class="msg" hidden></p>

    <section class="panel">
      <div class="panel-head">Добавить пользователя</div>
      <div class="panel-body">
        <div class="form-row">
          <label>
            <span>Логин</span>
            <input id="newUser" type="text" autocomplete="off" placeholder="anna" />
          </label>
          <label>
            <span>Пароль</span>
            <input id="newPass" type="text" autocomplete="new-password" placeholder="минимум 12 символов" />
          </label>
          <label style="flex: 1 1 140px;">
            <span>Заметка</span>
            <input id="newNote" type="text" autocomplete="off" placeholder="необязательно" />
          </label>
          <button id="genBtn" class="btn-ghost" style="height: 42px;" type="button">Сгенерировать</button>
          <button id="addBtn" class="btn" type="button">Добавить</button>
        </div>

        <div class="checkbox-row">
          <input id="newAdmin" type="checkbox" />
          <label for="newAdmin" style="margin:0;">Права администратора (доступ к этой странице)</label>
        </div>

        <p class="hint">
          Пароль показан открыто намеренно — его надо скопировать и передать человеку.
          После сохранения он больше нигде не отображается: в базе лежит только хеш.
        </p>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">Список</div>
      <div id="userList"></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const message = $('message');
    let me = null;

    function notify(text, kind = 'error') {
      message.textContent = text;
      message.className = `msg msg-${kind}`;
      message.hidden = false;
      if (kind === 'ok') setTimeout(() => { message.hidden = true; }, 4000);
    }

    async function api(method, body) {
      const res = await fetch('/api/admin', {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined
      });

      if (res.status === 401) { location.href = '/login.html'; return null; }

      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || data.error || `Ошибка ${res.status}`);
      return data;
    }

    function generatePassword() {
      // Исключены символы, которые путаются при переписывании: 0/O, 1/l/I.
      const alphabet = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const bytes = crypto.getRandomValues(new Uint32Array(20));
      return [...bytes].map((n) => alphabet[n % alphabet.length]).join('');
    }

    function row(user) {
      const el = document.createElement('div');
      el.className = 'user-row' + (user.disabled ? ' is-disabled' : '');
      const isSelf = user.username === me.username;

      const info = document.createElement('div');
      const name = document.createElement('span');
      name.className = 'user-name';
      name.textContent = user.username;
      info.append(name);

      if (user.isAdmin) info.append(tag('админ', 'tag-admin'));
      if (isSelf) info.append(tag('вы', 'tag-you'));
      if (user.disabled) info.append(tag('отключён', 'tag-off'));

      const meta = document.createElement('div');
      meta.className = 'user-meta';
      const parts = [];
      if (user.createdAt) parts.push('создан ' + new Date(user.createdAt).toLocaleDateString('ru-RU'));
      if (user.note) parts.push(user.note);
      meta.textContent = parts.join(' · ');
      info.append(meta);
      el.append(info);

      const actions = document.createElement('div');
      actions.className = 'user-actions';

      actions.append(button('Сменить пароль', async () => {
        const password = prompt(`Новый пароль для «${user.username}»\n(минимум 12 символов):`, generatePassword());
        if (password === null) return;
        await api('POST', { action: 'password', username: user.username, password });
        notify(`Пароль для «${user.username}» изменён. Передайте его вручную.`, 'ok');
      }));

      actions.append(button(user.isAdmin ? 'Снять админа' : 'Сделать админом', async () => {
        await api('POST', { action: 'admin', username: user.username, isAdmin: !user.isAdmin });
        await load();
      }, isSelf));

      actions.append(button(user.disabled ? 'Включить' : 'Отключить', async () => {
        await api('POST', { action: 'disabled', username: user.username, disabled: !user.disabled });
        await load();
      }, isSelf));

      actions.append(button('Удалить', async () => {
        if (!confirm(`Удалить «${user.username}»? Отменить будет нельзя.`)) return;
        await api('POST', { action: 'delete', username: user.username });
        await load();
      }, isSelf, true));

      el.append(actions);
      return el;
    }

    function tag(text, cls) {
      const el = document.createElement('span');
      el.className = `tag ${cls}`;
      el.textContent = text;
      el.style.marginLeft = '8px';
      return el;
    }

    function button(label, handler, disabled = false, danger = false) {
      const el = document.createElement('button');
      el.className = 'btn-ghost' + (danger ? ' danger' : '');
      el.textContent = label;
      el.disabled = disabled;
      el.addEventListener('click', async () => {
        el.disabled = true;
        try {
          await handler();
        } catch (error) {
          notify(error.message);
        } finally {
          el.disabled = disabled;
        }
      });
      return el;
    }

    async function load() {
      try {
        const data = await api('GET');
        if (!data) return;
        me = data.me;
        const list = $('userList');
        list.innerHTML = '';
        for (const user of data.users) list.append(row(user));
      } catch (error) {
        notify(error.message);
      }
    }

    $('genBtn').addEventListener('click', () => {
      $('newPass').value = generatePassword();
      $('newPass').classList.add('generated');
      $('newPass').select();
    });

    $('addBtn').addEventListener('click', async () => {
      const btn = $('addBtn');
      btn.disabled = true;
      try {
        await api('POST', {
          action: 'create',
          username: $('newUser').value,
          password: $('newPass').value,
          note: $('newNote').value,
          isAdmin: $('newAdmin').checked
        });

        const created = $('newUser').value.trim().toLowerCase();
        const password = $('newPass').value;
        notify(`Пользователь «${created}» создан. Пароль: ${password} — скопируйте его сейчас, больше он не покажется.`, 'ok');

        $('newUser').value = '';
        $('newPass').value = '';
        $('newNote').value = '';
        $('newAdmin').checked = false;
        await load();
      } catch (error) {
        notify(error.message);
      } finally {
        btn.disabled = false;
      }
    });

    load();
  </script>
</body>
</html>
